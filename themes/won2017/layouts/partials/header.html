<header id="header">
  <div class="logo">
    <i class="fas fa-cubes" style="font-size:2rem"></i>
  </div>
  <div class="content">
    <div class="inner">
      <h1>Nic Doye</h1>
      <p>Person of UNIX descent</p>
    </div>
  </div>
  <nav>
    <ul>
      {{ range (where site.Pages "Params.panel" "!=" nil).ByWeight }}
      <li><a href="#{{ .Params.panel }}" data-panel="{{ .Params.panel }}">{{ .Title }}</a></li>
      {{ end }}
    </ul>
  </nav>
</header>
