<head>
  <meta charset='utf-8'>
  <meta content='width=device-width, initial-scale=1, maximum-scale=1' name='viewport'> {{ hugo.Generator }}
  <meta content='1A3E7EF1BF62027B28C67EA4B9D0EB6B' name='msvalidate.01'>
  <meta name="description" content="Personal Web Site">
  <meta name="keywords" content="Nicolas, Nic, Doye">

  <!-- FONTAWESOME 5 Pro -->
  <script defer src="/fontawesome/fontawesome-all.min.js"></script>

  <!-- GOOGLE FONT -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300italic,600italic,300,600" type="text/css">

  {{- $opts := dict "transpiler" "dartsass" "targetPath" "css/style.css" "outputStyle" "compressed" }}
  {{- $style := resources.Get "scss/main.scss" | css.Sass $opts }}
  {{- if hugo.IsProduction }}
    {{- $style = $style | fingerprint }}
  {{- end }}
  <link href='{{ $style.RelPermalink }}' rel='stylesheet' type='text/css'{{ with $style.Data.Integrity }} integrity="{{ . }}"{{ end }}>

  <link rel=apple-touch-icon sizes=180x180 href=/apple-touch-icon.png>
  <link rel=icon type=image/png href=/favicon-32x32.png sizes=32x32>
  <link rel=icon type=image/png href=/favicon-16x16.png sizes=16x16>
  <link rel=mask-icon href=/safari-pinned-tab.svg color=#0594cb>

  <title>{{ .Site.Title }}</title>
</head>
